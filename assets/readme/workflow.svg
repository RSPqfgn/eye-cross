<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="160" viewBox="0 0 1200 160"
     role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Eye Cross 工作流</title>
  <desc id="wf-desc">四个步骤：扔出末影之眼自动记录轨迹；移动位置再扔一次获得第二条轨迹；系统最小二乘求出交点；点击聊天栏坐标一键传送。</desc>

  <defs>
    <style>
      .t-cn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#3A4354"/>
    </marker>
  </defs>

  <rect width="1200" height="160" rx="14" fill="#0C0F14"/>

  <!-- 步骤间连接线 -->
  <g stroke="#3A4354" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="236" y1="66" x2="306" y2="66" marker-end="url(#arrow)"/>
    <line x1="516" y1="66" x2="586" y2="66" marker-end="url(#arrow)"/>
    <line x1="796" y1="66" x2="866" y2="66" marker-end="url(#arrow)"/>
  </g>

  <!-- 01 扔出末影之眼 -->
  <g transform="translate(70 0)">
    <text class="t-mono" x="0" y="30" font-size="17" fill="#6BFF8C">01</text>
    <g transform="translate(92 22)">
      <circle cx="0" cy="14" r="13" fill="#11161F" stroke="#6BFF8C" stroke-width="2"/>
      <circle cx="0" cy="14" r="5.5" fill="#6BFF8C"/>
      <path d="M14 24 Q26 30 34 26" stroke="#6BFF8C" stroke-width="2" fill="none" stroke-dasharray="3 3"/>
    </g>
    <text class="t-cn" x="0" y="88" font-size="20" font-weight="600" fill="#E8ECF4">扔出末影之眼</text>
    <text class="t-cn" x="0" y="118" font-size="18" fill="#7C8698">飞行轨迹逐 tick 自动记录</text>
  </g>

  <!-- 02 换位再扔 -->
  <g transform="translate(350 0)">
    <text class="t-mono" x="0" y="30" font-size="17" fill="#6BFF8C">02</text>
    <g transform="translate(92 14)">
      <path d="M0 22 L38 44" stroke="#6BFF8C" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
      <path d="M0 44 L38 22" stroke="#6BFF8C" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
      <circle cx="0" cy="22" r="5" fill="#6BFF8C"/>
      <circle cx="0" cy="44" r="5" fill="#6BFF8C"/>
      <circle cx="38" cy="33" r="7" fill="none" stroke="#B78CFF" stroke-width="2"/>
    </g>
    <text class="t-cn" x="0" y="88" font-size="20" font-weight="600" fill="#E8ECF4">换位再扔一颗</text>
    <text class="t-cn" x="0" y="118" font-size="18" fill="#7C8698">两条方向不同的直线才好求交</text>
  </g>

  <!-- 03 自动求交 -->
  <g transform="translate(630 0)">
    <text class="t-mono" x="0" y="30" font-size="17" fill="#6BFF8C">03</text>
    <g transform="translate(92 14)">
      <circle cx="18" cy="33" r="13" fill="none" stroke="#B78CFF" stroke-width="2.5"/>
      <circle cx="18" cy="33" r="4" fill="#B78CFF"/>
      <line x1="18" y1="10" x2="18" y2="18" stroke="#B78CFF" stroke-width="2"/>
      <line x1="18" y1="48" x2="18" y2="56" stroke="#B78CFF" stroke-width="2"/>
      <line x1="-5" y1="33" x2="3" y2="33" stroke="#B78CFF" stroke-width="2"/>
      <line x1="33" y1="33" x2="41" y2="33" stroke="#B78CFF" stroke-width="2"/>
    </g>
    <text class="t-cn" x="0" y="88" font-size="20" font-weight="600" fill="#E8ECF4">最小二乘求交点</text>
    <text class="t-cn" x="0" y="118" font-size="18" fill="#7C8698">坐标 + 距离 + 误差一次给出</text>
  </g>

  <!-- 04 点击传送 -->
  <g transform="translate(910 0)">
    <text class="t-mono" x="0" y="30" font-size="17" fill="#6BFF8C">04</text>
    <g transform="translate(92 14)">
      <rect x="-8" y="12" width="140" height="38" rx="8" fill="#11161F" stroke="#1E2634" stroke-width="1"/>
      <text class="t-mono" x="2" y="36" font-size="17" fill="#6BFF8C">/tp @s X ~ Z</text>
    </g>
    <text class="t-cn" x="0" y="88" font-size="20" font-weight="600" fill="#E8ECF4">点击坐标传送</text>
    <text class="t-cn" x="0" y="118" font-size="18" fill="#7C8698">与原版 /locate 同款交互</text>
  </g>
</svg>
