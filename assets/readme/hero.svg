<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Eye Cross — 末影之眼轨迹三角定位末地要塞</title>
  <desc id="hero-desc">左侧为模组名称与一句话说明；右侧俯视图展示两次投掷的末影之眼轨迹虚线交叉于要塞准星节点，并标注实测坐标。</desc>

  <defs>
    <style>
      .t-cn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="#0C0F14"/>

  <!-- ── 左：标题区 ─────────────────────────────── -->
  <g transform="translate(56 46)">
    <text class="t-mono" x="0" y="0" font-size="17" fill="#7C8698" letter-spacing="2">MINECRAFT 26.1.2 · FABRIC · CLIENT-SIDE</text>

    <text class="t-cn" x="0" y="82" font-size="76" font-weight="700" fill="#E8ECF4">Eye <tspan fill="#6BFF8C">Cross</tspan></text>

    <!-- 母题：两条交叉轨迹 + 准星节点 -->
    <g transform="translate(4 116)">
      <path d="M0 22 L34 0" stroke="#6BFF8C" stroke-width="2" stroke-dasharray="5 4" fill="none" opacity="0.9"/>
      <path d="M0 0 L34 22" stroke="#6BFF8C" stroke-width="2" stroke-dasharray="5 4" fill="none" opacity="0.9"/>
      <circle cx="17" cy="11" r="7.5" fill="none" stroke="#B78CFF" stroke-width="2"/>
      <circle cx="17" cy="11" r="2.2" fill="#B78CFF"/>
    </g>

    <text class="t-cn" x="0" y="184" font-size="24" fill="#E8ECF4">扔两颗末影之眼，两条拟合直线交叉，直接得到要塞坐标</text>
    <text class="t-mono" x="0" y="222" font-size="17" fill="#7C8698">自动记录轨迹 · 线性拟合 · 最小二乘求交 · 一键传送</text>

    <text class="t-mono" x="0" y="266" font-size="16" fill="#545E70">eye-cross · 100% client-side · zero mixin · MIT</text>
  </g>

  <!-- ── 右：俯视测绘图 ─────────────────────────── -->
  <g transform="translate(700 36)">
    <rect width="464" height="268" rx="14" fill="#11161F" stroke="#1E2634" stroke-width="1"/>

    <!-- 稀疏坐标格网 -->
    <g stroke="#161C28" stroke-width="1">
      <path d="M58 0 V268 M116 0 V268 M174 0 V268 M232 0 V268 M290 0 V268 M348 0 V268 M406 0 V268"/>
      <path d="M0 45 H464 M0 90 H464 M0 135 H464 M0 180 H464 M0 225 H464"/>
    </g>

    <!-- 投掷点 1（左下） -->
    <g>
      <circle cx="76" cy="216" r="8" fill="#6BFF8C"/>
      <circle cx="76" cy="216" r="13" fill="none" stroke="#6BFF8C" stroke-width="1.5" opacity="0.35"/>
      <text class="t-cn" x="96" y="222" font-size="18" fill="#7C8698">第 1 次投掷</text>
    </g>

    <!-- 投掷点 2（左上） -->
    <g>
      <circle cx="48" cy="52" r="8" fill="#6BFF8C"/>
      <circle cx="48" cy="52" r="13" fill="none" stroke="#6BFF8C" stroke-width="1.5" opacity="0.35"/>
      <text class="t-cn" x="68" y="58" font-size="18" fill="#7C8698">第 2 次投掷</text>
    </g>

    <!-- 轨迹虚线，交于节点 -->
    <path d="M76 216 L310 114" stroke="#6BFF8C" stroke-width="2" stroke-dasharray="6 5" fill="none" opacity="0.85"/>
    <path d="M48 52 L310 114" stroke="#6BFF8C" stroke-width="2" stroke-dasharray="6 5" fill="none" opacity="0.85"/>

    <!-- 要塞准星节点 -->
    <g>
      <line x1="310" y1="82" x2="310" y2="98" stroke="#B78CFF" stroke-width="2"/>
      <line x1="310" y1="130" x2="310" y2="146" stroke="#B78CFF" stroke-width="2"/>
      <line x1="278" y1="114" x2="294" y2="114" stroke="#B78CFF" stroke-width="2"/>
      <line x1="326" y1="114" x2="342" y2="114" stroke="#B78CFF" stroke-width="2"/>
      <circle cx="310" cy="114" r="13" fill="none" stroke="#B78CFF" stroke-width="2.5"/>
      <circle cx="310" cy="114" r="4" fill="#B78CFF"/>
    </g>

    <text class="t-cn" x="310" y="66" font-size="20" font-weight="600" fill="#E8ECF4" text-anchor="middle">要塞？</text>
    <text class="t-mono" x="310" y="176" font-size="18" fill="#B78CFF" text-anchor="middle">X = -192.0   Z = 1616.1</text>
  </g>
</svg>
